<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Nuvora — a premium local-first calculator and everyday tools.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nuvora">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
<title>Nuvora Calculator</title>
</head>
<body>
<div id="app" class="app-shell">
<header class="topbar">
  <div class="brand"><div class="brand-mark">N</div><div><strong>Nuvora</strong><span>Calculator</span></div></div>
  <div class="top-actions">
    <button class="icon-btn" data-action="history" aria-label="Open history">↶</button>
    <button class="icon-btn" data-action="theme" aria-label="Change theme">◐</button>
    <button class="icon-btn" data-action="fullscreen" aria-label="Toggle fullscreen">⛶</button>
  </div>
</header>
<nav class="mode-tabs" aria-label="Calculator mode">
  <button class="mode-tab active" data-mode="basic">Basic</button>
  <button class="mode-tab" data-mode="scientific">Scientific</button>
  <button class="mode-tab" data-mode="tools">Tools</button>
</nav>
<main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
