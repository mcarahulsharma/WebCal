<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraCalc Pro - Precision Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        .calculator-case {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.1);
        }
        .glass-screen {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* Custom scrollbar for modal drawers */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
    </style>

    <!-- Progressive Web App metadata -->
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="AuraCalc Pro - Precision scientific calculator with unit conversion, EMI, age, tip, memory and history tools.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4 transition-colors duration-300">

    <div class="calculator-case w-full max-w-md bg-slate-900 border border-slate-700/80 rounded-[2.5rem] p-5 sm:p-6 flex flex-col relative overflow-hidden transition-all duration-300 shadow-2xl" id="calc-chassis">
        
        <!-- Top Utility Bar: Theme switcher, mode indicator, and tool buttons -->
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800 text-xs">
            <div class="flex items-center space-x-2">
                <button onclick="cycleTheme()" id="theme-badge-btn" class="px-2.5 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold transition flex items-center space-x-1.5 cursor-pointer">
                    <i id="theme-icon" class="fa-solid fa-moon text-indigo-400"></i>
                    <span id="theme-text">Dark</span>
                </button>
                <button onclick="toggleAngleMode()" id="angle-mode-btn" class="px-2.5 py-1 rounded-full bg-slate-800 hover:bg-slate-700 text-indigo-400 font-bold transition cursor-pointer">DEG</button>
            </div>
            
            <div class="flex items-center space-x-1.5">
                <button onclick="openModal('converter')" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-indigo-600 hover:text-white text-slate-300 flex items-center justify-center transition cursor-pointer shadow-sm" title="Unit Converter">
                    <i class="fa-solid fa-right-left text-xs"></i>
                </button>
                <button onclick="openModal('finance')" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-indigo-600 hover:text-white text-slate-300 flex items-center justify-center transition cursor-pointer shadow-sm" title="Loan & EMI">
                    <i class="fa-solid fa-wallet text-xs"></i>
                </button>
                <button onclick="openModal('tools')" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-indigo-600 hover:text-white text-slate-300 flex items-center justify-center transition cursor-pointer shadow-sm" title="Tips & Age">
                    <i class="fa-solid fa-toolbox text-xs"></i>
                </button>
                <button onclick="openModal('history')" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-indigo-600 hover:text-white text-slate-300 flex items-center justify-center transition cursor-pointer relative shadow-sm" title="History">
                    <i class="fa-solid fa-clock-rotate-left text-xs"></i>
                    <span id="history-dot" class="absolute top-1 right-1 w-2 h-2 rounded-full bg-indigo-500 hidden"></span>
                </button>
            </div>
        </div>

        <div class="bg-slate-950/90 rounded-2xl p-4 mb-4 border border-slate-800 flex flex-col justify-end text-right min-h-[110px] shadow-inner relative overflow-hidden">
            <div id="calc-expression" class="text-xs text-slate-500 font-mono tracking-wider min-h-[18px] truncate"></div>
            <div id="calc-display" class="text-3xl sm:text-4xl font-bold tracking-tight text-white font-mono break-all mt-1">0</div>
            <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-900 text-[10px] text-slate-500 font-mono">
                <span id="memory-slot" class="text-amber-400 font-bold hidden">MEM ACTIVE</span>
                <span id="calc-status" class="truncate">Ready</span>
            </div>
        </div>

        <div class="grid grid-cols-5 gap-2" id="keypad-grid">
            <!-- Row 1: Scientific Trig & Roots -->
            <button onclick="appendFunc('sin(')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">sin</button>
            <button onclick="appendFunc('cos(')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">cos</button>
            <button onclick="appendFunc('tan(')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">tan</button>
            <button onclick="appendValue('(')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">(</button>
            <button onclick="appendValue(')')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">)</button>

            <!-- Row 2: Inverses & Logs -->
            <button onclick="appendFunc('asin(')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">sin⁻¹</button>
            <button onclick="appendFunc('acos(')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">cos⁻¹</button>
            <button onclick="appendFunc('atan(')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">tan⁻¹</button>
            <button onclick="appendFunc('log(')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">log</button>
            <button onclick="appendFunc('ln(')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">ln</button>

            <!-- Row 3: Powers & Constants -->
            <button onclick="appendValue('^')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">x^y</button>
            <button onclick="appendFunc('sqrt(')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">√x</button>
            <button onclick="appendValue('π')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">π</button>
            <button onclick="appendValue('e')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">e</button>
            <button onclick="appendFunc('fact(')" class="btn-sci text-xs font-semibold py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition">n!</button>

            <!-- Row 4: Controls & Operators -->
            <button onclick="clearCalc()" class="btn-ctrl text-sm font-bold py-3 rounded-xl bg-rose-950/60 text-rose-400 hover:bg-rose-900/60 transition">AC</button>
            <button onclick="backspaceCalc()" class="btn-ctrl text-sm font-bold py-3 rounded-xl bg-amber-950/60 text-amber-400 hover:bg-amber-900/60 transition"><i class="fa-solid fa-delete-left"></i></button>
            <button onclick="appendValue('%')" class="btn-ctrl text-sm font-bold py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition">%</button>
            <button onclick="appendValue('/')" class="btn-op text-sm font-bold py-3 rounded-xl bg-indigo-950/60 text-indigo-400 hover:bg-indigo-900/60 transition">÷</button>
            <button onclick="appendValue('*')" class="btn-op text-sm font-bold py-3 rounded-xl bg-indigo-950/60 text-indigo-400 hover:bg-indigo-900/60 transition">×</button>

            <!-- Row 5: 7, 8, 9, Minus, Memory Store -->
            <button onclick="appendValue('7')" class="btn-num text-base font-semibold py-3.5 rounded-xl bg-slate-800/50 hover:bg-slate-700 text-white transition">7</button>
            <button onclick="appendValue('8')" class="btn-num text-base font-semibold py-3.5 rounded-xl bg-slate-800/50 hover:bg-slate-700 text-white transition">8</button>
            <button onclick="appendValue('9')" class="btn-num text-base font-semibold py-3.5 rounded-xl bg-slate-800/50 hover:bg-slate-700 text-white transition">9</button>
            <button onclick="appendValue('-')" class="btn-op text-sm font-bold py-3.5 rounded-xl bg-indigo-950/60 text-indigo-400 hover:bg-indigo-900/60 transition">-</button>
            <button onclick="memoryStore()" class="btn-mem text-xs font-bold py-3.5 rounded-xl bg-slate-800 text-slate-400 hover:bg-slate-700 transition">MS</button>

            <!-- Row 6: 4, 5, 6, Plus, Memory Recall -->
            <button onclick="appendValue('4')" class="btn-num text-base font-semibold py-3.5 rounded-xl bg-slate-800/50 hover:bg-slate-700 text-white transition">4</button>
            <button onclick="appendValue('5')" class="btn-num text-base font-semibold py-3.5 rounded-xl bg-slate-800/50 hover:bg-slate-700 text-white transition">5</button>
            <button onclick="appendValue('6')" class="btn-num text-base font-semibold py-3.5 rounded-xl bg-slate-800/50 hover:bg-slate-700 text-white transition">6</button>
            <button onclick="appendValue('+')" class="btn-op text-sm font-bold py-3.5 rounded-xl bg-indigo-950/60 text-indigo-400 hover:bg-indigo-900/60 transition">+</button>
            <button onclick="memoryRecall()" class="btn-mem text-xs font-bold py-3.5 rounded-xl bg-slate-800 text-slate-400 hover:bg-slate-700 transition">MR</button>

            <!-- Row 7: 1, 2, 3, Equals (span 2), Memory Clear -->
            <button onclick="appendValue('1')" class="btn-num text-base font-semibold py-3.5 rounded-xl bg-slate-800/50 hover:bg-slate-700 text-white transition">1</button>
            <button onclick="appendValue('2')" class="btn-num text-base font-semibold py-3.5 rounded-xl bg-slate-800/50 hover:bg-slate-700 text-white transition">2</button>
            <button onclick="appendValue('3')" class="btn-num text-base font-semibold py-3.5 rounded-xl bg-slate-800/50 hover:bg-slate-700 text-white transition">3</button>
            <button onclick="calculateResult()" class="btn-eq row-span-2 text-lg font-bold rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/30 hover:opacity-95 transition flex items-center justify-center">=</button>
            <button onclick="memoryClear()" class="btn-mem text-xs font-bold py-3.5 rounded-xl bg-slate-800 text-slate-400 hover:bg-slate-700 transition">MC</button>

            <!-- Row 8: 0 (span 2), Dot, Ans -->
            <button onclick="appendValue('0')" class="btn-num col-span-2 text-base font-semibold py-3.5 rounded-xl bg-slate-800/50 hover:bg-slate-700 text-white transition">0</button>
            <button onclick="appendValue('.')" class="btn-num text-base font-semibold py-3.5 rounded-xl bg-slate-800/50 hover:bg-slate-700 text-white transition">.</button>
            <button onclick="appendAns()" class="btn-sci text-xs font-bold py-3.5 rounded-xl bg-slate-800 text-slate-400 hover:bg-slate-700 transition">Ans</button>
        </div>
    </div>

    <div id="calc-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-3xl p-6 shadow-2xl animate-pop flex flex-col max-h-[90vh]">
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                <h3 id="modal-title" class="font-bold text-base text-white flex items-center space-x-2">
                    <i id="modal-title-icon" class="fa-solid fa-toolbox text-indigo-500"></i>
                    <span id="modal-title-text">Tool Suite</span>
                </h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Content Panels -->
            <div id="modal-body" class="overflow-y-auto flex-1 pr-1 space-y-4">
                <!-- Dynamic Content injected via JS -->
            </div>
        </div>
    </div>

    <script>
        // Core State Variables
        let currentExpression = '';
        let currentDisplay = '0';
        let memoryValue = 0;
        let lastAns = 0;
        let angleMode = 'DEG';
        let calculationHistory = [];

        // Theme Cycling State
        const themes = [
            { name: 'Dark', class: 'dark', bg: 'radial-gradient(circle at center, #1e293b 0%, #0f172a 100%)', chassis: 'bg-slate-900 border-slate-700', icon: 'fa-moon text-indigo-400' },
            { name: 'Light', class: 'light', bg: 'radial-gradient(circle at center, #f1f5f9 0%, #cbd5e1 100%)', chassis: 'bg-white border-slate-300 text-slate-900', icon: 'fa-sun text-amber-500' },
            { name: 'Cyber', class: 'dark', bg: 'radial-gradient(circle at center, #064e3b 0%, #022c22 100%)', chassis: 'bg-slate-950 border-emerald-500/50', icon: 'fa-bolt text-emerald-400' },
            { name: 'Sunset', class: 'dark', bg: 'radial-gradient(circle at center, #4c0519 0%, #1f050c 100%)', chassis: 'bg-slate-950 border-rose-500/50', icon: 'fa-fire text-rose-500' }
        ];
        let currentThemeIdx = 0;

        function cycleTheme() {
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            const t = themes[currentThemeIdx];
            document.body.style.background = t.bg;
            document.getElementById('theme-text').innerText = t.name;
            document.getElementById('theme-icon').className = `fa-solid ${t.icon}`;
            
            const chassis = document.getElementById('calc-chassis');
            chassis.className = `calculator-case w-full max-w-md ${t.chassis} rounded-[2.5rem] p-5 sm:p-6 flex flex-col relative overflow-hidden transition-all duration-300 shadow-2xl`;
            if(t.class === 'light') {
                chassis.classList.add('text-slate-900');
            } else {
                chassis.classList.remove('text-slate-900');
            }
        }

        // Calculator Input Handling
        function updateCalcDisplay() {
            document.getElementById('calc-expression').innerText = currentExpression;
            document.getElementById('calc-display').innerText = currentDisplay;
        }

        function appendValue(val) {
            if (currentDisplay === 'Error' || currentDisplay === 'Infinity') {
                currentDisplay = '0';
                currentExpression = '';
            }
            if (currentDisplay === '0' && !['+', '-', '*', '/', '%', '.', '^'].includes(val)) {
                currentDisplay = val;
            } else {
                currentDisplay += val;
            }
            currentExpression += val;
            updateCalcDisplay();
        }

        function appendFunc(funcName) {
            currentExpression += funcName;
            currentDisplay += funcName;
            updateCalcDisplay();
        }

        function appendAns() {
            currentExpression += lastAns;
            currentDisplay += lastAns;
            updateCalcDisplay();
        }

        function clearCalc() {
            currentExpression = '';
            currentDisplay = '0';
            document.getElementById('calc-status').innerText = 'Cleared';
            updateCalcDisplay();
        }

        function backspaceCalc() {
            if (currentExpression.length > 0) {
                currentExpression = currentExpression.slice(0, -1);
                currentDisplay = currentExpression === '' ? '0' : currentExpression;
                updateCalcDisplay();
            }
        }

        function toggleAngleMode() {
            angleMode = angleMode === 'DEG' ? 'RAD' : 'DEG';
            document.getElementById('angle-mode-btn').innerText = angleMode;
            document.getElementById('calc-status').innerText = `Angle: ${angleMode}`;
        }

        function memoryStore() {
            try {
                memoryValue = evaluateExpression(currentDisplay);
                document.getElementById('memory-slot').classList.remove('hidden');
                document.getElementById('calc-status').innerText = 'Stored to Memory';
            } catch (e) {
                document.getElementById('calc-status').innerText = 'Memory Error';
            }
        }

        function memoryRecall() {
            currentExpression += memoryValue;
            currentDisplay += memoryValue;
            updateCalcDisplay();
        }

        function memoryClear() {
            memoryValue = 0;
            document.getElementById('memory-slot').classList.add('hidden');
            document.getElementById('calc-status').innerText = 'Memory Cleared';
        }

        // Expression Evaluator Parser
        function evaluateExpression(exprStr) {
            let sanitized = exprStr
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/π/g, 'Math.PI')
                .replace(/e/g, 'Math.E')
                .replace(/\^/g, '**');

            sanitized = sanitized.replace(/sqrt\(/g, 'Math.sqrt(');
            sanitized = sanitized.replace(/log\(/g, 'Math.log10(');
            sanitized = sanitized.replace(/ln\(/g, 'Math.log(');

            const toRad = angleMode === 'DEG' ? '(Math.PI/180)*' : '';
            sanitized = sanitized.replace(/sin\(/g, `Math.sin(${toRad}`);
            sanitized = sanitized.replace(/cos\(/g, `Math.cos(${toRad}`);
            sanitized = sanitized.replace(/tan\(/g, `Math.tan(${toRad}`);
            
            sanitized = sanitized.replace(/asin\(/g, `(1/${angleMode === 'DEG' ? 'Math.PI*180' : '1'})*Math.asin(`);
            sanitized = sanitized.replace(/acos\(/g, `(1/${angleMode === 'DEG' ? 'Math.PI*180' : '1'})*Math.acos(`);
            sanitized = sanitized.replace(/atan\(/g, `(1/${angleMode === 'DEG' ? 'Math.PI*180' : '1'})*Math.atan(`);

            sanitized = sanitized.replace(/fact\(([0-9]+)\)/g, (match, n) => {
                let num = parseInt(n);
                let res = 1;
                for(let i=2; i<=num; i++) res *= i;
                return res;
            });

            let result = Function(`return ${sanitized}`)();
            if (isNaN(result) || !isFinite(result)) throw new Error('Calculation error');
            return Number(result.toFixed(8));
        }

        function calculateResult() {
            try {
                let res = evaluateExpression(currentExpression);
                let record = `${currentExpression} = ${res}`;
                lastAns = res;
                calculationHistory.unshift(record);
                if (calculationHistory.length > 25) calculationHistory.pop();
                document.getElementById('history-dot').classList.remove('hidden');
                
                currentDisplay = String(res);
                currentExpression = String(res);
                updateCalcDisplay();
                document.getElementById('calc-status').innerText = 'Success';
            } catch (err) {
                currentDisplay = 'Error';
                updateCalcDisplay();
                document.getElementById('calc-status').innerText = 'Expression Error';
            }
        }

        // Modal Management & Internal Tools Suite
        function openModal(type) {
            const modal = document.getElementById('calc-modal');
            const titleText = document.getElementById('modal-title-text');
            const titleIcon = document.getElementById('modal-title-icon');
            const body = document.getElementById('modal-body');

            modal.classList.remove('hidden');

            if (type === 'converter') {
                titleText.innerText = 'Unit Converter';
                titleIcon.className = 'fa-solid fa-right-left text-indigo-500';
                body.innerHTML = `
                    <div class="space-y-3">
                        <label class="block text-xs font-semibold text-slate-400">Category</label>
                        <select id="conv-cat" onchange="setupConverter()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="length">Length & Distance</option>
                            <option value="area">Area</option>
                            <option value="weight">Weight & Mass</option>
                            <option value="temp">Temperature</option>
                        </select>
                        <div class="grid grid-cols-2 gap-3 pt-2">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">From Value</label>
                                <input type="number" id="conv-val" value="1" oninput="runConversion()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono font-bold focus:outline-none">
                                <select id="conv-from" onchange="runConversion()" class="w-full mt-2 bg-slate-800 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white"></select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Converted</label>
                                <div id="conv-result" class="text-xl font-bold font-mono text-indigo-400 p-2 bg-slate-950 rounded-xl border border-slate-800 truncate">0</div>
                                <select id="conv-to" onchange="runConversion()" class="w-full mt-2 bg-slate-800 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white"></select>
                            </div>
                        </div>
                    </div>
                `;
                setupConverter();
            } else if (type === 'finance') {
                titleText.innerText = 'Loan EMI Calculator';
                titleIcon.className = 'fa-solid fa-wallet text-indigo-500';
                body.innerHTML = `
                    <div class="space-y-3 text-sm">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Loan Amount ($)</label>
                            <input type="number" id="loan-amt" value="200000" oninput="calculateLoan()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono font-bold">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Interest Rate (% p.a.)</label>
                            <input type="number" step="0.1" id="loan-rate" value="7.0" oninput="calculateLoan()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono font-bold">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Tenure (Years)</label>
                            <input type="number" id="loan-years" value="25" oninput="calculateLoan()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono font-bold">
                        </div>
                        <div class="p-4 rounded-2xl bg-indigo-950/40 border border-indigo-900/50 mt-4 space-y-1">
                            <span class="text-xs text-indigo-400 font-semibold block">Monthly EMI Result</span>
                            <div id="loan-emi-res" class="text-2xl font-extrabold font-mono text-white">$0</div>
                        </div>
                    </div>
                `;
                calculateLoan();
            } else if (type === 'tools') {
                titleText.innerText = 'Tip Splitter & Age';
                titleIcon.className = 'fa-solid fa-toolbox text-indigo-500';
                body.innerHTML = `
                    <div class="space-y-4 text-sm">
                        <div class="p-3 bg-slate-800/50 rounded-2xl border border-slate-800">
                            <span class="font-bold text-indigo-400 text-xs block mb-2">Smart Tip Calculator</span>
                            <div class="grid grid-cols-2 gap-2 mb-2">
                                <input type="number" id="tip-bill" value="75" placeholder="Bill ($)" oninput="calculateTip()" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-white">
                                <input type="number" id="tip-split" value="2" placeholder="People" oninput="calculateTip()" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-white">
                            </div>
                            <div class="text-xs text-slate-300 flex justify-between pt-1 font-mono">
                                <span>Per Person: <strong id="tip-per-person" class="text-indigo-400">$0</strong></span>
                            </div>
                        </div>
                        <div class="p-3 bg-slate-800/50 rounded-2xl border border-slate-800">
                            <span class="font-bold text-indigo-400 text-xs block mb-2">Age Calculator</span>
                            <input type="date" id="dob-val" value="1998-05-12" onchange="calculateAge()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-white text-xs mb-2">
                            <div id="age-res" class="text-xs text-slate-300 font-mono">--</div>
                        </div>
                    </div>
                `;
                calculateTip();
                calculateAge();
            } else if (type === 'history') {
                titleText.innerText = 'Calculation History';
                titleIcon.className = 'fa-solid fa-clock-rotate-left text-indigo-500';
                body.innerHTML = `
                    <div class="space-y-2 max-h-[60vh] overflow-y-auto">
                        ${calculationHistory.length === 0 ? '<p class="text-xs text-slate-500 text-center py-6">No calculations recorded yet.</p>' : 
                          calculationHistory.map(item => `
                            <div class="p-3 rounded-xl bg-slate-800/50 border border-slate-800 text-xs font-mono flex justify-between items-center text-slate-300">
                                <span>${item}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('calc-modal').classList.add('hidden');
        }

        // Converter helper data
        const convUnitsData = {
            length: { m: 1, km: 1000, cm: 0.01, mi: 1609.34, ft: 0.3048, in: 0.0254 },
            area: { sqm: 1, sqkm: 1000000, sqft: 0.0929, acre: 4046.86 },
            weight: { kg: 1, g: 0.001, lb: 0.4536, oz: 0.0283 },
            temp: { C: 1, F: 1, K: 1 }
        };

        function setupConverter() {
            const cat = document.getElementById('conv-cat').value;
            const units = Object.keys(convUnitsData[cat]);
            const fromSel = document.getElementById('conv-from');
            const toSel = document.getElementById('conv-to');
            const html = units.map(u => `<option value="${u}">${u.toUpperCase()}</option>`).join('');
            fromSel.innerHTML = html;
            toSel.innerHTML = html;
            if(units.length > 1) toSel.selectedIndex = 1;
            runConversion();
        }

        function runConversion() {
            const cat = document.getElementById('conv-cat').value;
            const val = parseFloat(document.getElementById('conv-val').value) || 0;
            const from = document.getElementById('conv-from').value;
            const to = document.getElementById('conv-to').value;
            
            if (cat === 'temp') {
                let c = val;
                if (from === 'F') c = (val - 32) * 5/9;
                if (from === 'K') c = val - 273.15;
                let res = c;
                if (to === 'F') res = c * 9/5 + 32;
                if (to === 'K') res = c + 273.15;
                document.getElementById('conv-result').innerText = res.toFixed(2);
            } else {
                const base = val * convUnitsData[cat][from];
                const res = base / convUnitsData[cat][to];
                document.getElementById('conv-result').innerText = Number(res.toFixed(6));
            }
        }

        function calculateLoan() {
            const p = parseFloat(document.getElementById('loan-amt').value) || 0;
            const r = parseFloat(document.getElementById('loan-rate').value) / 12 / 100 || 0;
            const n = (parseFloat(document.getElementById('loan-years').value) || 0) * 12;
            let emi = 0;
            if (r > 0 && n > 0) {
                emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            } else if (n > 0) {
                emi = p / n;
            }
            document.getElementById('loan-emi-res').innerText = '$' + emi.toFixed(2);
        }

        function calculateTip() {
            const bill = parseFloat(document.getElementById('tip-bill').value) || 0;
            const split = parseInt(document.getElementById('tip-split').value) || 1;
            const total = bill * 1.15; // 15% standard tip
            const perPerson = split > 0 ? total / split : total;
            document.getElementById('tip-per-person').innerText = '$' + perPerson.toFixed(2);
        }

        function calculateAge() {
            const dob = new Date(document.getElementById('dob-val').value);
            const now = new Date();
            let yrs = now.getFullYear() - dob.getFullYear();
            let mos = now.getMonth() - dob.getMonth();
            if(mos < 0) { yrs--; mos += 12; }
            document.getElementById('age-res').innerText = `${yrs} Years, ${mos} Months old`;
        }

        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || ['+', '-', '*', '/', '.', '(', ')', '%'].includes(e.key)) {
                appendValue(e.key);
            } else if (e.key === 'Enter') {
                calculateResult();
            } else if (e.key === 'Backspace') {
                backspaceCalc();
            }
        });

        window.onload = () => {
            updateCalcDisplay();
        };
    </script>
</body>
</html>

    // Register the service worker so WebCal can be installed and work offline.
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => {
                console.warn('Service worker registration failed:', err);
            });
        });
    }
</script>
